name: Build & Release OpenClaw Android APK

on:
  schedule:
    # Every 6 hours at :15 past the hour (02:15, 08:15, 14:15, 20:15 CST)
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenClaw git ref/branch/tag to build"
        required: false
        default: "main"
      force:
        description: "Force build even if no new commits"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

env:
  OC_REPO: openclaw/openclaw
  OC_REF: ${{ github.event.inputs.ref || 'main' }}
  FORCE_BUILD: ${{ github.event.inputs.force || 'false' }}

jobs:
  check:
    name: Check for new OpenClaw commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      oc_sha: ${{ steps.meta.outputs.oc_sha }}
      oc_short_sha: ${{ steps.meta.outputs.oc_short_sha }}
      oc_version: ${{ steps.meta.outputs.oc_version }}
    steps:
      - name: Resolve OpenClaw metadata
        id: meta
        run: |
          set -euo pipefail

          OC_SHA=$(curl -sf "https://api.github.com/repos/${OC_REPO}/commits?sha=${OC_REF}&per_page=1" | jq -r '.[0].sha')
          if [ -z "$OC_SHA" ] || [ "$OC_SHA" = "null" ]; then
            echo "::error::Failed to fetch latest OpenClaw commit"
            exit 1
          fi
          OC_SHORT_SHA="${OC_SHA:0:7}"

          GRADLE_URL="https://raw.githubusercontent.com/${OC_REPO}/${OC_REF}/apps/android/app/build.gradle.kts"
          GRADLE_CONTENT=$(curl -sf "$GRADLE_URL" || true)
          OC_VERSION=$(echo "$GRADLE_CONTENT" | grep -oP 'versionName\s*=\s*"\K[^"]+' || true)
          if [ -z "$OC_VERSION" ]; then
            echo "::warning::Could not extract versionName, using date-based version"
            OC_VERSION=$(date +%Y.%-m.%-d)
          fi

          echo "oc_sha=${OC_SHA}" >> "$GITHUB_OUTPUT"
          echo "oc_short_sha=${OC_SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "oc_version=${OC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest OpenClaw commit: ${OC_SHA}"
          echo "OpenClaw version: ${OC_VERSION}"

          if [ "${FORCE_BUILD}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested"
            exit 0
          fi

          LAST_BODY=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body // ""' || true)
          PREV_SHA=$(echo "$LAST_BODY" | grep -oP '(?<=openclaw-commit: )\S+' || true)
          echo "Previous commit: ${PREV_SHA:-none}"

          if [ "$OC_SHA" = "$PREV_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new commits, skipping build"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New commits detected, will build"
          fi

  build:
    name: Build Android APKs (${{ matrix.flavor }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [thirdParty, play]
    steps:
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OC_REPO }}
          ref: ${{ env.OC_REF }}
          path: openclaw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build ${{ matrix.flavor }} debug APK
        working-directory: openclaw/apps/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
        run: |
          set -euo pipefail
          TASK="assemble${{ matrix.flavor }}Debug"
          ./gradlew ":app:${TASK}" --no-daemon --stacktrace

      - name: Locate and rename APK
        id: rename
        run: |
          set -euo pipefail
          OUT_DIR="openclaw/apps/android/app/build/outputs/apk/${{ matrix.flavor }}/debug"
          echo "APK output dir: ${OUT_DIR}"
          find "$OUT_DIR" -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \;

          SRC=$(find "$OUT_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK found in ${OUT_DIR}"
            exit 1
          fi

          DST="openclaw-android-${{ needs.check.outputs.oc_version }}-${{ needs.check.outputs.oc_short_sha }}-${{ matrix.flavor }}-debug.apk"
          cp "$SRC" "$DST"
          ls -lh "$DST"
          echo "apk_name=${DST}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: openclaw-android-${{ needs.check.outputs.oc_version }}-${{ needs.check.outputs.oc_short_sha }}-${{ matrix.flavor }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: apk-*

      - name: List downloaded files
        run: find apks -type f -name "*.apk" -exec ls -lh {} \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.oc_version }}-${{ needs.check.outputs.oc_short_sha }}
          name: OpenClaw Android ${{ needs.check.outputs.oc_version }} (${{ needs.check.outputs.oc_short_sha }})
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Auto-built from [openclaw/openclaw@${{ needs.check.outputs.oc_sha }}](https://github.com/openclaw/openclaw/commit/${{ needs.check.outputs.oc_sha }})

            OpenClaw version: **${{ needs.check.outputs.oc_version }}**
            OpenClaw commit: `${{ needs.check.outputs.oc_sha }}`

            ### APKs
            - `*-thirdParty-debug.apk` — thirdParty flavor (full capabilities, recommended for sideloading)
            - `*-play-debug.apk` — Play flavor (closer to Google Play build)

            ### Install
            If you already have the Play version installed (`ai.openclaw.app`), uninstall it first:
            ```
            adb uninstall ai.openclaw.app
            adb install openclaw-android-<version>-<sha>-thirdParty-debug.apk
            ```

            ---
            openclaw-commit: ${{ needs.check.outputs.oc_sha }}
          files: |
            apks/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
