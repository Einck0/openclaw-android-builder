name: Build OpenClaw Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenClaw git ref/branch/tag to build"
        required: false
        default: "main"
      flavor:
        description: "Android flavor to build"
        required: true
        default: "thirdParty"
        type: choice
        options:
          - thirdParty
          - play

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.flavor }} Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: openclaw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Show Android version from source
        run: |
          grep -n "versionCode\|versionName" openclaw/apps/android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: openclaw/apps/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
        run: |
          FLAVOR="${{ github.event.inputs.flavor }}"
          TASK="assemble${FLAVOR^}Debug"
          ./gradlew ":app:${TASK}" --no-daemon --stacktrace

      - name: List APK outputs
        run: |
          find openclaw/apps/android/app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-${{ github.event.inputs.flavor }}-debug-apk
          path: openclaw/apps/android/app/build/outputs/apk/${{ github.event.inputs.flavor }}/debug/*.apk
          if-no-files-found: error
